        function Homepage() {
            const students = ["ali", "dilan", "mika"];
            const [Likes, Setlikes] = React.useState(0);
            const [Dislikes, SetDislikes] = React.useState(0);
            function HandleClick() {
                Setlikes(Likes + 1);

            }

            function HandleClickDislike() {
                SetDislikes(Dislikes - 1);

            }

            return <div>
                <ul>
                    {students.map((student) => (
                        <li key={student}>{student}</li> //key membantu React mengidentifikasi item mana yang berubah, ditambahkan, atau dihapus dalam sebuah daftar.
                    ))}
                </ul>
                <button onClick={HandleClick}>like({Likes})</button>
                <button onClick={HandleClickDislike}>Dislikes({Dislikes})</button>
            </div>
        }
