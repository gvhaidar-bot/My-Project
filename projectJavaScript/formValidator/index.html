<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <form action="" id="registerForm">
            <h1>login</h1>
            <div class="form-grub">
                <label for="">username</label>
                <input type="text" placeholder="masukan username..." id="username">
                <small>username dibutuhkan</small>
            </div>
            <div class="form-grub">
                <label for="">email</label>
                <input type="email" placeholder=" isi form email..." id="email">
                <small> email dibutuhkan</small>
            </div>
            <div class="form-grub">
                <label for="">password</label>
                <input type="password" id="password" placeholder="masukan sandi ">
                <small> password wajib disi</small>
            </div>
            <button>submit</button>
        </form>
    </div>


</body>

</html>
